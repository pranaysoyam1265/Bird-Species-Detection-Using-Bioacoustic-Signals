# ── BirdSense ── Docker Compose ──
# Usage:
#   docker-compose up --build
#   docker-compose down

services:
  backend:
    build:
      context: ./08_Deployment/Backend
      dockerfile: Dockerfile
    container_name: birdsense-backend
    ports:
      - "8000:8000"
    environment:
      - DEVICE=cpu
      - FASTAPI_PORT=8000
      - ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000
      - MODEL_PATH=/app/models/best_model_v3.pth
      - LABEL_MAPPING_PATH=/app/labels/label_mapping_v3.json
    volumes:
      - ./05_Model/Saved_Models:/app/models/checkpoints:ro
      - ./04_Labels/Processed_Labels:/app/labels:ro
      - backend-uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./08_Deployment/Frontend
      dockerfile: Dockerfile
    container_name: birdsense-frontend
    ports:
      - "3000:3000"
    environment:
      - FASTAPI_URL=http://backend:8000
      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_here}
      - NODE_ENV=production
    volumes:
      - frontend-data:/app/data
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend-uploads:
  frontend-data:
